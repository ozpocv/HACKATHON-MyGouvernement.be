<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Budget Belgique 2024</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Budget Belgique 2024 <span class="small">(159 milliards €)</span></h1>

        <!-- ÉCRAN D'ACCUEIL -->
        <div id="ecran-accueil" class="center-screen">
            <h2>MyGouvernement.be</h2>
            <p>Choisis ton style de gouvernance :</p>
            <div class="mode-selection">
                <button onclick="setMode('Écolo')" class="mode-btn ecolo">Écolo</button>
                <button onclick="setMode('Social')" class="mode-btn social">Social</button>
                <button onclick="setMode('Équilibré')" class="mode-btn" id="default-mode">Équilibré</button>
            </div>
            <button id="btn-commencer" class="start-btn" style="display:none;">Commencer le jeu</button>
        </div>

        <!-- JEU -->
        <div id="jeu" style="display:none;">
            <div id="info-culture" class="info-box"></div>
            <div id="bulle" class="bulle">Prêt à commencer ?</div>
            <div id="options" class="options"></div>

            <div id="warning-reste" class="warning-box" style="display:none;">
                <p><strong>Il reste <span id="reste-pct"></span>% du budget !</strong></p>
                <p>Que fais-tu de cet argent ?</p>
                <button onclick="choisirReste(true)" class="btn-peuple">Redistribué au peuple</button>
                <button onclick="choisirReste(false)" class="btn-ministre">Dans la poche des ministres</button>
            </div>

            <div class="progress-container">
                <div id="progress" class="progress"></div>
            </div>
            <p class="total">Total : <span id="total">0</span>%</p>

            <img id="personnage" src="/static/neutral.gif" alt="Personnage" width="120">

            <h3>Récapitulatif</h3>
            <ul id="recapList" class="recap"></ul>

            <button id="nextBtn" class="next-btn" style="display:none;">Suivant</button>
            
            <!-- BOUTON RECOMMENCER -->
            <button id="btn-recommencer" class="restart-btn" style="display:none;">Recommencer</button>
        </div>
    </div>
    <!-- ZONE DES GIFS DE RÉACTION -->
<h3>Réactions</h3>
<div id="reaction-gallery" class="reaction-gallery">
    <!-- Les GIFs seront ajoutés ici dynamiquement -->
</div>

    <script src="/static/script.js"></script>
</body>
</html>
