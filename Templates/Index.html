<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget 159 Milliards - Jeu</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- FOND GLOBAL -->
  <div class="background"></div>

  <!-- PERSONNAGE AU MILIEU -->
  <div class="reaction-center" id="reaction-center">
    <img id="reaction-img" src="/static/neutral.png" alt="Personnage" class="loaded">
    <p id="reaction-label">Prêt à gérer le budget !</p>
  </div>

  <!-- QUESTIONNAIRE FIXE À DROITE -->
  <div class="questionnaire">
    <h1>Budget : {{ budget | format_number }} €</h1>

    <div class="progress-container">
      <div class="progress" id="progress"></div>
    </div>
    <p class="total">Budget alloué : <span id="total">0</span>%</p>

    <div class="bulle" id="bulle">
      Appuie sur <strong>Suivant</strong> pour commencer !
    </div>

    <div class="options" id="options"></div>

    <button class="next-btn" id="nextBtn">Suivant</button>
    <button class="restart-btn" id="btn-recommencer" style="display: none;">Recommencer</button>

    <div class="info-box" id="info-culture"></div>
    <ul class="recap" id="recapList"></ul>

    <div class="warning-box" id="warning-reste" style="display: none;">
      <p>Il reste <span id="reste-pct">0</span>% à répartir !</p>
      <button class="btn-peuple" onclick="choisirReste(true)">Donner au peuple</button>
      <button class="btn-ministre" onclick="choisirReste(false)">Garder pour les ministres</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
